upstream energyshark_backend {
    server 127.0.0.1:8000;
    server 127.0.0.1:8001;
}

server {

    server_name energyshark-danielamp.tech www.energyshark-danielamp.tech;

    location / {
        proxy_pass http://energyshark_backend;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_next_upstream error timeout http_502 http_503 http_504;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header X-EnergyShark-Backend $upstream_addr always;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/energyshark-danielamp.tech/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/energyshark-danielamp.tech/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.energyshark-danielamp.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = energyshark-danielamp.tech) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;

    server_name energyshark-danielamp.tech www.energyshark-danielamp.tech;
    return 404; # managed by Certbot
}